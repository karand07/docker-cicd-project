version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "5000:3000"   # host:container
    env_file:
      - ./backend/.env
    depends_on:
      - db

  frontend1:
    build: ./farmer_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  frontend2:
    build: ./company_frontend
    ports:
      - "3001:80"
    depends_on:
      - backend

  frontend3:
    build: ./admin_frontend
    ports:
      - "3002:80"
    depends_on:
      - backend

  db:
    image: mongo
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: